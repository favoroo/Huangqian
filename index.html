<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黄谦的个人网站</title>
    <meta name="description" content="黄谦的个人作品集：汽车诊断工程师、部门 AI 提效负责人、独立开发者。" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta property="og:title" content="黄谦的个人网站" />
    <meta property="og:description" content="用AI把想法落地。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%img/veil-photo.webp" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#hero">跳到主内容</a>

    <!-- ===== NAV ===== -->
    <header class="nav">
      <div class="container nav__inner">
        <a class="nav__logo" href="#hero">HQ<em>/</em></a>
        <nav class="nav__links" aria-label="主导航">
          <a class="nav__link" href="#career">经历</a>
          <a class="nav__link" href="#works">作品</a>
          <a class="nav__link" href="#contact">联系</a>
          <span class="nav__meta" aria-hidden="true">CHANGSHA, CN</span>
          <button class="nav__burger" id="burger" aria-label="打开菜单" aria-expanded="false">
            <span></span>
          </button>
        </nav>
      </div>
    </header>

    <!-- ===== fullscreen menu (mobile) ===== -->
    <div class="menu" id="menu" aria-hidden="true">
      <div class="container menu__head">
        <span>MENU</span>
        <button class="menu__close" id="menuClose" aria-label="关闭菜单">✕</button>
      </div>
      <div class="container">
        <nav class="menu__list" aria-label="移动导航">
          <a class="menu__item" href="#career"><span>01</span>经历</a>
          <a class="menu__item" href="#works"><span>02</span>作品</a>
          <a class="menu__item" href="#contact"><span>03</span>联系</a>
        </nav>
      </div>
    </div>

    <!-- ===== HERO ===== -->
    <section class="hero" id="hero">
      <div class="container hero__grid">
        <div class="hero__text">
          <p class="hero__eyebrow reveal">HUANG QIAN — PORTFOLIO 2026</p>
          <h1 class="hero__name">
            <span class="reveal-line"><span>黄谦</span></span>
          </h1>
          <div class="hero__rule reveal-rule" aria-hidden="true"></div>
          <p class="hero__tag">
            <span class="reveal-line"><span style="--rd: 200ms">用AI把想法落地。</span></span>
          </p>
        </div>
        <div
          class="hero__veil"
          id="veil"
          role="img"
          aria-label="抖动点阵图像：鼠标扫过处显出彩色原图"
        ></div>
      </div>
    </section>

    <!-- ===== 职业经历 ===== -->
    <section class="section" id="career" data-no="01">
      <div class="container">
        <p class="section__index section__index--center reveal">职业经历</p>
        <div class="career">
          <div class="career__head">
            <dl class="career__facts reveal">
              <div class="career__fact">
                <dt>时间</dt>
                <dd>2021.07 — 至今</dd>
              </div>
              <div class="career__fact">
                <dt>公司</dt>
                <dd>湖南省道通科技有限公司</dd>
              </div>
            </dl>
            <a class="career__cta reveal" style="--rd:300ms" href="https://favoroo.github.io/Q-profile/" target="_blank" rel="noopener">
              查看完整职业履历 <span class="arrow" aria-hidden="true">→</span>
            </a>
          </div>
          <div class="career__story">
            <h2 class="career__line">
              <span class="reveal-line"><span>从汽车技术工程师，</span></span>
              <span class="reveal-line"><span style="--rd:150ms">到部门 <em>AI 提效负责人</em>。</span></span>
            </h2>
          </div>
          <div class="reels">
            <p class="reels__label reveal">AI 提效 · 录屏实录</p>
            <div class="reels__row" id="reelsRow"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 当前作品 ===== -->
    <section class="section" id="works" data-no="02">
      <div class="container">
        <p class="section__index section__index--center reveal">作品</p>
        <div class="works" id="worksGrid"></div>
      </div>
    </section>

    <!-- ===== 联系 ===== -->
    <footer class="contact" id="contact" data-no="03">
      <div class="container">
        <p class="section__index reveal">CONTACT</p>
        <h2 class="contact__big">
          <span class="contact__tech" id="contactTech"></span>
        </h2>
        <div class="contact__links reveal" style="--rd:200ms">
          <a class="contact__link" href="mailto:favoro@qq.com">
            <span>favoro@qq.com</span><span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="contact__link" href="https://github.com/favoroo" target="_blank" rel="noopener">
            <span>github.com/favoroo</span><span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="contact__link" href="tel:13789130001">
            <span>电话/微信 13789130001</span><span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
        <p class="contact__bottom">© 2026 黄谦 · HUANGQIAN</p>
      </div>
    </footer>

    <!-- ===== 录屏弹窗 ===== -->
    <dialog class="lightbox" id="lightbox" aria-label="录屏播放">
      <div class="lightbox__bar">
        <span class="lightbox__title" id="lightboxTitle"></span>
        <div class="lightbox__tabs" id="lightboxTabs" hidden></div>
        <button class="lightbox__close" id="lightboxClose" aria-label="关闭播放窗口">✕</button>
      </div>
      <div class="lightbox__stage" id="lightboxStage">
        <video id="lightboxVideo" controls muted playsinline preload="auto"></video>
      </div>
    </dialog>
  </body>
</html>
